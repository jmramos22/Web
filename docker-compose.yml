name: taller-laravel-web

services:
  web_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: taller-laravel-web/app:dev
    container_name: taller_web_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
    networks:
      - taller_shared_network
    command: sh -c "composer install && php-fpm"

  web_server:
    image: nginx:1.27-alpine
    container_name: taller_web_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_app
    networks:
      - taller_shared_network

  web_node:
    image: node:20-alpine
    container_name: taller_web_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/node_modules
    networks:
      - taller_shared_network

networks:
  taller_shared_network:
    external: true