      .card-copy { font-size: 14px; fill: #6E7F93; }
      .nav { font-size: 13px; font-weight: 600; fill: #566B82; }
      .nav-active { font-size: 13px; font-weight: 700; fill: #174A80; }
      .section { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; fill: #75869A; }
      .item { font-size: 14px; font-weight: 650; fill: #243B55; }
      .detail { font-size: 12px; fill: #78899C; }
      .metric { font-size: 26px; font-weight: 750; fill: #173758; }
      .metric-label { font-size: 11px; font-weight: 650; fill: #708198; }
      .button-text { font-size: 12px; font-weight: 700; fill: #fff; }
