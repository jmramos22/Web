<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" fill="none">
  <defs>
    <linearGradient id="background" x1="120" y1="40" x2="1390" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F7FB"/>
      <stop offset="1" stop-color="#E7EEF5"/>
    </linearGradient>
    <linearGradient id="student" x1="70" y1="0" x2="510" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174A80"/>
      <stop offset="1" stop-color="#246CA0"/>
    </linearGradient>
    <linearGradient id="tutor" x1="530" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
